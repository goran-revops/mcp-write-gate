name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches pyproject.toml and server.json
        run: |
          python - <<'EOF'
          import json, os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json"))
          code = re.search(r'__version__ = "(.+)"', open("mcp_write_gate/__init__.py").read()).group(1)
          versions = {project, code, server["version"], server["packages"][0]["version"]}
          if versions != {tag}:
              raise SystemExit(f"tag {tag} does not match versions {versions}")
          EOF
      - run: pip install -e ".[dev]" build
      - run: pytest -q
      - run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Publish to the MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # PyPI can take a moment to show the new release, which the registry checks.
          for attempt in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; sleep 30; done
          exit 1
